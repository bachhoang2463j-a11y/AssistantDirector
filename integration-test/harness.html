<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Assistant Director（副导演）S0~S1 · 集成测试 harness</title>
<style>
  body { margin: 0; font: 13px/1.7 Consolas, Menlo, monospace; background: #0b1020; color: #dbe4ff; }
  #bar { position: sticky; top: 0; z-index: 99999; padding: 10px 14px; background: #111936; border-bottom: 1px solid #263056; display: flex; gap: 12px; align-items: center; }
  #bar button { padding: 6px 14px; border-radius: 8px; border: 1px solid #4c5db0; background: #1b2550; color: #dbe4ff; cursor: pointer; font: inherit; }

</head>
<body>
<div id="bar">
  <button id="run">▶ 运行全部断言</button>
  <span id="stat" class="info">等待加载产物…</span>
  <span id="note">产物：../酒馆助手脚本-副导演.json（真实 content，非副本）· UI 将挂在本页右侧</span>
</div>
<pre id="log"></pre>

<script>
/* ════════════════════════════════════════════════════════════════════
   mock 酒馆助手环境（与真实 API 同构）
   ════════════════════════════════════════════════════════════════════ */
const WB_MOCK = (function () {
  // 世界书写入通道 mock：books=可写存储（注入词条），fixtures=固定资料书（双通道/S2 段注册，reset 不清除）
  const store = { books: {}, binding: null, uid: 0 };
  const fixtures = {};
  const calls = { creates: [], updates: [] };   // 写 API 调用记录（entry 名——幂等断言的计数源）

  const clone = v => v === undefined ? v : JSON.parse(JSON.stringify(v));
  const bookOf = name => store.books[name] || (store.books[name] = []);

  window.getCharWorldbookNames = function () { return clone(store.binding); };
  window.getCurrentCharacterName = () => '测试角色';
  window.createWorldbook = function (name) { bookOf(name); };
  window.rebindCharWorldbooks = function (scope, bind) { store.binding = clone(bind); bookOf(bind.primary); };
  window.createWorldbookEntries = function (book, entries) {
    const list = bookOf(book);
    for (const e of entries || []) { list.push(Object.assign({ uid: ++store.uid }, clone(e))); calls.creates.push(e.name); }
  };
  window.updateWorldbookWith = function (book, fn) {
    const out = fn(clone(bookOf(book))) || [];
    store.books[book] = out;
    for (const e of out) if (e) calls.updates.push(e.name);
  };
  // 统一 getWorldbook：固定资料书优先（同步读路径），否则可写存储
  window.getWorldbook = async function (name) {
    if (fixtures[name]) return clone(fixtures[name]);
    return clone(bookOf(name));
  };
  window.getWorldbookNames = () => Object.keys(store.books).concat(Object.keys(fixtures));

  function reset() {
    store.books = {}; store.uid = 0; calls.creates = []; calls.updates = [];
    store.binding = { primary: '主世界书', additional: [] };
    bookOf('主世界书');
  }
  reset();
  const find = name => {
    for (const bk of Object.keys(store.books)) {
      const e = (store.books[bk] || []).find(x => x && x.name === name);
      if (e) return e;
    }
    return null;
  };
  return {
    reset, fixtures, calls, find,
    entry: name => { const e = find(name); return e ? e.content : null; },
    writes: name => calls.creates.filter(n => n === name).length + calls.updates.filter(n => n === name).length,
    binding: () => clone(store.binding),
    // 模拟用户在世界书编辑器里直接改词条（改内容/调位置——不经脚本写 API）
    patch(name, fields) { const e = find(name); if (e) Object.assign(e, clone(fields)); },
  };
})();

const MOCK = (function () {
  const store = { chat: {}, message: {} };   // message: { 楼层号: {…} }
  let floorCount = 0;
  const listeners = [];

  const clone = v => v === undefined ? v : JSON.parse(JSON.stringify(v));
  const realId = id => (id < 0 ? floorCount + id : id);

  window.tavern_events = {
    MESSAGE_RECEIVED: 'MESSAGE_RECEIVED',
    MESSAGE_UPDATED: 'MESSAGE_UPDATED',
    MESSAGE_SWIPED: 'MESSAGE_SWIPED',
    CHAT_CHANGED: 'CHAT_CHANGED',
  };
  window.getVariables = function (opt) {
    const o = opt || {};
    if (o.type === 'chat') return clone(store.chat);
    if (o.type === 'message') {
      const id = o.message_id == null ? floorCount - 1 : realId(o.message_id);
      return clone(store.message[id] || {});
    }
    return {};
  };
  window.insertOrAssignVariables = function (vars, opt) {
    const o = opt || {};
    const bucket = o.type === 'chat' ? store.chat
      : o.type === 'message' ? (store.message[realId(o.message_id == null ? -1 : o.message_id)] ||= {})
      : null;
    if (!bucket) return;
    for (const k of Object.keys(vars || {})) bucket[k] = clone(vars[k]);
  };
  window.replaceVariables = function (vars, opt) {
    const o = opt || {};
    if (o.type === 'chat') store.chat = clone(vars) || {};
  };
  window.eventOn = function (name, cb) { listeners.push({ name, cb }); };
  window.eventEmit = function (name) {
    for (const l of listeners) if (l.name === name) try { l.cb(); } catch (e) { console.error(e); }
  };

  return {
    // 测试辅助
    addFloor(vars) { store.message[floorCount++] = vars || {}; },
    setFloorStat(statData) {
      if (floorCount === 0) floorCount = 1;   // 空楼层表时先立一楼，否则 message_id:-1 解析不到
      store.message[floorCount - 1] = { stat_data: { '状态栏': statData } };
    },
    reset() {
      // 原地清空（不能重新赋值——MOCK.chat 持有引用，重新赋值会与之脱钩）
      for (const k of Object.keys(store.chat)) delete store.chat[k];
      store.message = {}; floorCount = 0;
      WB_MOCK.reset();   // 世界书写入通道同清（重跑/换段隔离）
    },
    eventEmit: (name) => window.eventEmit(name),
    chat: store.chat,
  };
})();

/* ════════════════════════════════════════════════════════════════════
   mock SillyTavern（副导演楼层上下文优先路径 + LWB 摘要通路）
   ════════════════════════════════════════════════════════════════════ */
const ST_MOCK = (function () {
  const chat = [];
  for (let i = 0; i < 30; i++) {
    if (i % 5 === 3) chat.push({ mes: `玩家输入第${i}楼`, is_user: true, is_system: false });
    else if (i % 7 === 6) chat.push({ mes: `被LWB隐藏的旧楼${i}`, is_user: false, is_system: true });   // /hide → is_system（真机实证字段）
    else chat.push({ mes: `AI叙事第${i}楼：夜色中的悉尼。` + (i === 10 ? '\n```状态栏代码块```\n' : ''), is_user: false, is_system: false });
  }
  const aiIds = chat.map((m, i) => (!m.is_user && !m.is_system) ? i : -1).filter(i => i >= 0);
  const meta = {
    extensions: {
      LittleWhiteBox: {
        storySummary: {
          lastSummarizedMesId: 14,
          json: {
            keywords: [{ text: '黑法老兄弟会', weight: '核心' }, { text: '剃刀帮战争', weight: '核心' }],
            events: [
              { timeLabel: '1925年6月12日 08:45', title: '悉尼港海关大厅·入境刁难化解',
                summary: '爱德华出示军情五处信函施压放行。(角色：「台词」) #1-3' },
              { timeLabel: '1925年6月12日 14:50', title: '伦道夫仓库·潜入搜查禁区',
                summary: '玛德琳与索恩发现黑法老长袍与祭祀木棍。 #1-3' },
            ],
          },
        },
      },
    },
  };
  // 真机形态：chat 不在 SillyTavern 顶层，经 getContext() 暴露（实证 2026-09-09）
  window.SillyTavern = { getContext: () => ({ chat, chatMetadata: meta }), chatMetadata: meta };
  return { chat, aiIds };
})();

/* ════════════════════════════════════════════════════════════════════
   测试数据（取自真实聊天记录 #27 楼 stat_data 的结构）
   ════════════════════════════════════════════════════════════════════ */
const CH = (name, hp, hpMax, ammoStr) => ({
  '角色': {
    '名字': ' ' + name,
    '属性': `[❤️HP:${hp}/${hpMax}][🔮MP:110/110][🛡️Armor:40][🧠SAN:59/65]`,
    '弹药': ammoStr,
  },
});
const STAT = (loc, chars) => ({
  '日期和时间': '⏰ 1925年 · 6月13日 · 13:00 · 潜伏期',
  '地点': loc,
  '角色列表': chars,
});

const STAT_SUITE = STAT('📍 悉尼 · 澳大利亚酒店 - 总督套房 · 客厅与全景窗前', [
  CH('🔮埃利奥特', 100, 100, '[🔩] [.32子弹：20]'),
  CH('🛡️弗兰克', 180, 180, '[🔩] [.45子弹：28]'),
]);
const STAT_GREEN = STAT('📍 悉尼 · 萨里山 · 绿顶酒馆 · 大堂', [
  CH('🔮埃利奥特', 100, 100, '[🔩] [.32子弹：20]'),
  CH('🛡️弗兰克', 180, 180, '[🔩] [.45子弹：28]'),
]);
const STAT_GREEN_DOWNED = STAT('📍 悉尼 · 萨里山 · 绿顶酒馆 · 大堂', [
  CH('🔮埃利奥特', 100, 100, '[🔩] [.32子弹：20]'),
  CH('🛡️弗兰克', 0, 180, '[🔩] [.45子弹：28]'),
]);
const STAT_GREEN_LOWAMMO = STAT('📍 悉尼 · 萨里山 · 绿顶酒馆 · 大堂', [
  CH('🔮埃利奥特', 100, 100, '[🔩] [.32子弹：10]'),
  CH('🛡️弗兰克', 180, 180, '[🔩] [.45子弹：8]'),
]);
const STAT_ALLEY = STAT('📍 悉尼 · 萨里山 · 某条后巷 · 苦力的棚屋前', [
  CH('🔮埃利奥特', 100, 100, '[🔩] [.32子弹：20]'),
]);

const CARDS = [
  { place: '绿顶酒馆', aliases: ['凯特的酒馆', 'Green Roof'], faction: '凯特·利（萨里山）',
    menu: '萨里山剃刀党混混*4~6/私酒蒸馏师*3~5/黑帮职业杀手*1~2', alert: '警戒',
    reaction: '应邀客人以礼相待、敬酒试探；亮械或闯后场酒窖立即翻脸。',
    verdict: '拒酒属待客试探，不构成开战；拔枪、闯后场禁区、暴露警方关联才构成。', source: 'daily' },
  { place: '澳大利亚酒店', aliases: ['总督套房'], faction: '无（中立场所·己方据点）',
    menu: '', alert: '常规', reaction: '酒店以住客隐私为重；大堂滋事召巡警。', source: 'daily' },
  { place: '伦道夫船运仓库', aliases: ['达令港仓库'], faction: '伦道夫船运（黑法老触点）',
    menu: '达令港码头武装打手*4~6', alert: '严密',
    reaction: '白天禁区周边有人即喝止驱逐，夜间闯入直接动手。', source: 'daily' },
];

/* ════════════════════════════════════════════════════════════════════
   断言框架
   ════════════════════════════════════════════════════════════════════ */
const logEl = document.getElementById('log');
const statEl = document.getElementById('stat');
let passed = 0, failed = 0;
function line(cls, msg) { logEl.innerHTML += `<span class="${cls}">${msg}</span>\n`; }
function head(t) { line('head', `── ${t} ──`); }
function ok(desc, extra) { passed++; line('pass', `  ✓ ${desc}${extra ? '  ⟨' + extra + '⟩' : ''}`); }
function ng(desc, extra) { failed++; line('fail', `  ✗ ${desc}${extra ? '  ⟨' + extra + '⟩' : ''}`); }
function assert(desc, cond, extra) { cond ? ok(desc, extra) : ng(desc, extra); }
const sleep = ms => new Promise(r => setTimeout(r, ms));
// 条件轮询：IAB 对未聚焦页面节流 setTimeout（实测 ~1s 粒度），
// 固定 sleep 与 content 的 800ms 去抖时序不可控，改为自适应等待
async function waitFor(cond, timeoutMs = 15000) {
  const t0 = Date.now();
  while (Date.now() - t0 < timeoutMs) {
    if (cond()) return true;
    await sleep(150);
  }
  return cond();
}

let AD = null;

/* ════════════════════════════════════════════════════════════════════
   断言套件
   ════════════════════════════════════════════════════════════════════ */
async function runAll() {
  passed = 0; failed = 0; logEl.innerHTML = '';

  /* ——— 载入真实产物 ——— */
  head('环境与初始化');
  let json;
  try {
    const res = await fetch('../酒馆助手脚本-副导演.json');
    json = await res.json();
  } catch (e) { ng('产物 JSON 加载失败', String(e)); return finish(); }
  assert('产物 JSON 载入（type=script）', json.type === 'script');
  assert('content 非空', typeof json.content === 'string' && json.content.length > 1000, `${json.content.length} 字符`);
  MOCK.reset();   // 重跑隔离：清残留楼层变量与世界书词条（HAS_WB 探测在 content 执行时完成）
  try { new Function(json.content).call(window); } catch (e) { ng('content 执行异常', String(e)); return finish(); }
  AD = window.__AD__;
  assert('__AD__ 测试钩子暴露', !!AD);
  assert('LIVE 环境检测通过（mock API 全套）', AD.IS_LIVE === true);
  assert('世界书写入能力探测通过（注入通道）', AD.HAS_WB === true);
  assert('悬浮窗挂载（#ad-rail）', !!document.getElementById('ad-rail'));
  assert('面板挂载（#ad-panel）', !!document.getElementById('ad-panel'));  assert('GM 工具按钮 ×4（报头内联：📡↻🗂⚙）', document.querySelectorAll('#ad-panel .ad-head-btns button').length === 4);
  await sleep(1200); // init 去抖静默期（无 stat → 只走禁用探测，不建词条）
  assert('无楼层时 init 不写入词条', WB_MOCK.writes('副导演-态势') === 0 && WB_MOCK.writes('副导演-暗线') === 0);

  /* ——— 纯函数：归一化与三级匹配 ——— */
  head('地点归一化与三级匹配');
  assert('剥 emoji/空白归一化', AD.norm('📍 悉尼 · 绿顶酒馆') === '悉尼 · 绿顶酒馆');
  let m = AD.matchCard('📍 悉尼 · 萨里山 · 绿顶酒馆 · 大堂', CARDS);
  assert('包含匹配命中绿顶酒馆', m && m.card.place === '绿顶酒馆', `score=${m && m.score.toFixed(2)}`);
  m = AD.matchCard('凯特的酒馆', CARDS);
  assert('别名全等命中', m && m.card.place === '绿顶酒馆');
  m = AD.matchCard('绿顶酒馆', CARDS);
  assert('place 全等命中', m && m.card.place === '绿顶酒馆');
  m = AD.matchCard('📍 悉尼 · 总督套房 · 客厅', CARDS);
  assert('别名包含命中（总督套房→澳大利亚酒店）', m && m.card.place === '澳大利亚酒店');
  m = AD.matchCard('📍 悉尼 · 萨里山 · 某条后巷 · 苦力的棚屋前', CARDS);
  assert('未命中返回 null（不可穷尽地点）', m === null);
  const cardsAmbig = [
    CARDS[0],
    { place: '悉尼', aliases: [], faction: 'X', menu: '', alert: '常规' },
  ];
  m = AD.matchCard('📍 悉尼 · 萨里山 · 绿顶酒馆', cardsAmbig);
  assert('多卡命中择优（具体名 > 泛地名）', m && m.card.place === '绿顶酒馆', `胜者=${m && m.card.place}`);
  assert('空地点文本不匹配', AD.matchCard('', CARDS) === null);
  assert('空卡片池不匹配', AD.matchCard('绿顶酒馆', []) === null);

  /* ——— 纯函数：menu 解析 ——— */
  head('menu 解析');
  let entries = AD.parseMenu('萨里山剃刀党混混*4~6/私酒蒸馏师*3~5/黑帮职业杀手*1~2');
  assert('区间词条解析 ×3', entries.length === 3 && entries[0].name === '萨里山剃刀党混混' && entries[0].min === 4 && entries[0].max === 6);
  entries = AD.parseMenu('打手*4');
  assert('固定数量解析', entries[0].min === 4 && entries[0].max === 4);
  entries = AD.parseMenu('夏恩(夏盖妖虫)');
  assert('无数量标记解析（min=max=0）', entries[0].min === 0 && entries[0].max === 0);
  entries = AD.parseMenu('');
  assert('空 menu 解析为空数组', entries.length === 0);
  entries = AD.parseMenu('打手×4～6／保镖*2');
  assert('全角符号容错（×／～）', entries[0].min === 4 && entries[0].max === 6 && entries[1].min === 2);

  /* ——— 纯函数：stat 解析 ——— */
  head('stat_data 解析');
  assert('HP 属性解析', JSON.stringify(AD.parseAttr('[❤️HP:0/180][🔮MP:110/110]', 'HP')) === '{"cur":0,"max":180}');
  assert('HP 属性缺失返回 null', AD.parseAttr('[🛡️Armor:40]', 'HP') === null);
  assert('弹药求和（多词条）', AD.parseAmmoTotal('[🔩] [.45子弹：28][12号独头弹：0]') === 28);
  assert('弹药零值计入', AD.parseAmmoTotal('[🔩] [.45子弹：0]') === 0);
  assert('角色列表归一（剥包装）', AD.charList(STAT_GREEN).length === 2);

  /* ——— 纯函数：规模随行重算 ——— */
  head('规模随行重算');
  AD.state.ammoBaseline = 0; // 重置基准
  let scaled = AD.computeScale(AD.parseMenu(CARDS[0].menu), STAT_GREEN);
  assert('正常状态取区间中值（4~6→5）', scaled[0].count === 5, `count=${scaled[0].count}`);
  assert('弹药基准记录（20+28=48）', AD.state.ammoBaseline === 48, `baseline=${AD.state.ammoBaseline}`);
  scaled = AD.computeScale(AD.parseMenu(CARDS[0].menu), STAT_GREEN_DOWNED);
  assert('有倒地 → 下限-1（4~6→3）', scaled[0].count === 3, `count=${scaled[0].count}`);
  scaled = AD.computeScale(AD.parseMenu(CARDS[0].menu), STAT_GREEN_LOWAMMO);
  assert('弹药消耗过半（48→18） → 降档', scaled[0].count === 3, `count=${scaled[0].count}`);
  scaled = AD.computeScale(AD.parseMenu('打手*1~2'), STAT_GREEN_DOWNED);
  assert('下限保护（min=1 → 不低于1）', scaled[0].count === 1, `count=${scaled[0].count}`);

  /* ——— 纯函数：注入文本拼装 ——— */
  head('注入文本拼装（三种形态）');
  scaled = AD.computeScale(AD.parseMenu(CARDS[0].menu), STAT_GREEN);
  let text = AD.buildSituationText(CARDS[0], scaled, '📍 悉尼 · 萨里山 · 绿顶酒馆 · 大堂');
  assert('命中卡：XML 包裹（开合标签完整）', text.startsWith(AD.SIT_OPEN) && text.endsWith(AD.SIT_CLOSE));
  assert('命中卡：地点行（两空格缩进）', text.includes('  📍 悉尼 · 萨里山 · 绿顶酒馆 · 大堂'));
  assert('命中卡：驻守+派系+菜单（规模已重算，缩进列表）', text.includes('  驻守：凯特·利（萨里山）（萨里山剃刀党混混*5/私酒蒸馏师*4/黑帮职业杀手*2）'));
  assert('命中卡：反应模式', text.includes('反应模式：应邀客人以礼相待'));
  assert('命中卡：战斗轮规则提醒（只写名字）', text.includes('<Combat_block>') && text.includes('我方/敌方各只写名字'));
  assert('命中卡：场景判定标准', text.includes('判定标准：拒酒属待客试探'));
  text = AD.buildSituationText(CARDS[2], AD.computeScale(AD.parseMenu(CARDS[2].menu), STAT_GREEN), 'x');
  assert('无 verdict 卡片回落默认判定', text.includes('判定标准：玩家行动在语义上构成'));
  text = AD.buildSafeText('📍 悉尼 · 澳大利亚酒店 - 总督套房');
  assert('安全变体：无可见敌人 + 认知外突袭保留', text.includes('当前场景无可见敌人，但不排除剧情合理范围内的认知外突袭'));
  assert('安全变体：XML 包裹', text.startsWith(AD.SIT_OPEN) && text.endsWith(AD.SIT_CLOSE) && text.includes('  若冲突升级，按【战斗轮规则】输出 <Combat_block>。'));
  text = AD.buildFallbackText('某条后巷');

  /* ——— 副导演双通道上下文（楼层窗口 / LWB 摘要 / 两套世界书配置 / 迁移）——— */
  head('副导演双通道上下文');
  {
    // 世界书 mock：固定资料书注册进 WB_MOCK（reset 不清除，跨段复用；词条名带等级前缀 + keys，对齐真实 V3.0 结构）
    WB_MOCK.fixtures['剧情世界书'] = [   // position/order 乱序（模拟 getWorldbook 原始返回与酒馆上下文顺序无关）
      { name: '悉尼', content: '悉尼是新南威尔士首府，1925 年黑帮与警方在东区对峙。' + '很长的城市背景资料。'.repeat(300) + '【词条尾部标记】',
        position: { type: 'at_depth', order: 100 } },
      { name: '当地邪教：沙蝎教派', content: '潜伏在内辖的邪教组织，与内陆货运有隐秘关联。',
        position: { type: 'before_character_definition', order: 1 } },
    ];
    WB_MOCK.fixtures['COC-澳大利亚篇敌人与召唤物图鉴V3.0'] = [
      { name: '澳大利亚战役敌人图鉴·总览与索引', content: '本图鉴整合了全部敌方势力：街头犯罪/执法/邪教/眷族四类。' },
      { name: '1级·萨里山剃刀党混混', strategy: { keys: ['萨里山剃刀党混混', '剃刀党混混'] } },
      { name: '2级·达令港码头武装打手', strategy: { keys: ['达令港码头武装打手', '码头打手'] } },
      { name: '2级·悉尼常规巡警', strategy: { keys: ['悉尼常规巡警', '悉尼巡警'] } },
    ];

    // 楼层窗口：mock 30 楼（AI 25 / 玩家 4 / hidden… 动态计数）
    const aiCount = ST_MOCK.aiIds.length;
    const last20 = ST_MOCK.aiIds.slice(-20);

    assert('F1 默认窗口取最近 20 个 AI 楼', last20.every(id => ctx.includes(`AI叙事第${id}楼`))
      && !ctx.includes(`AI叙事第${ST_MOCK.aiIds[0]}楼`), `AI楼共${aiCount}个`);
    assert('F2 排除玩家输入', !ctx.includes('玩家输入'));
    assert('F3 排除 /hide 隐藏楼（is_system 字段，真机实证）', !ctx.includes('被LWB隐藏'));
    assert('F4 楼层分隔线严格排版（━━ + 楼层号，causes 出处用）', ctx.includes('━━━━━━ 楼层'));
    assert('F5 代码块剥除', !ctx.includes('状态栏代码块'));

    const ctxAll = AD.getShadowlineFloorContext();
    assert('F6 0=全部历史 AI 楼', ST_MOCK.aiIds.every(id => ctxAll.includes(`AI叙事第${id}楼`)));

    // LWB 摘要（早期历史载体）

    const shText = await AD.getSyncedWorldbookText('shadowline');

    assert('W2 两套配置独立（暗线位只含自己勾的词条）', shText.includes('邪教组织') && !shText.includes('新南威尔士'));
    const sKeep = AD.loadSettings();

      && AD.loadSettings().worldSyncSituation[0].book === '剧情世界书');
    sKeep.worldSyncSituation = sW2.worldSyncSituation; AD.saveSettings(sKeep);   // 还原 W 段原配置
    assert('P1 两套配置 + 楼层窗口持久化往返', AD.loadSettings().worldSyncSituation.length === 1
      && AD.loadSettings().worldSyncShadowline[0].entries[0] === '当地邪教：沙蝎教派'
      && AD.loadSettings().shadowlineFloors === 20);
    // W4 世界书按酒馆上下文顺序（position.type 分组 + order 升序）输出

    AD.saveSettings(sW3);

  /* ——— S2 态势位即时产卡（mock LLM 环境）——— */
  head('S2 态势位即时产卡');

    assert('L1 地标键：大区后首字段（含子标题）', AD.landmarkKey('📍 悉尼 · 澳大利亚酒店 - 总督套房 · 客厅与全景窗前') === '澳大利亚酒店 - 总督套房');
    assert('L2 地标键：房间级变化不改变键', AD.landmarkKey('📍 悉尼 · 澳大利亚酒店 - 总督套房 · 玄关') === '澳大利亚酒店 - 总督套房');

    assert('S7b 信息完整性：长词条全量注入（无截断）', syncText.includes('【词条尾部标记】'));
    assert('S8 同步配置持久化往返', AD.loadSettings().worldSyncSituation.length === 2
      && AD.loadSettings().worldSyncSituation[0].entries[0] === '悉尼');

      st.remove();
      const data2 = st.load();
      assert('T13d 删除自定义回落默认（currentSys 回默认构造）', data2.active === 'default' && !data2.presets.some(p => p.name === '自定义A')
        && st.currentSys() === AD.DEFAULT_SHADOWLINE_SYS());
      st.remove();
      assert('T13e 默认项不可删（remove 兜底静默拒绝）', st.load().presets.some(p => p.id === 'default'));
      // 态势位预设独立（不同 localStorage 键，互不污染）
      AD.SituationPrompt.add('态势B');
      assert('T13f 两链路预设独立存储（暗线删空不影响态势新建）',
        AD.SituationPrompt.load().presets.some(p => p.name === '态势B') && !AD.ShadowlinePrompt.load().presets.some(p => p.name === '态势B'));
      AD.SituationPrompt.remove();   // 清理，回落默认
    }
    AD.renderWire();
    assert('T12 surface 上报纸（公开征兆 + 派系 + 三态徽标）', (() => {
      const wire = document.getElementById('ad-wire').innerText;
      return wire.includes('绿顶酒馆谢绝散客') && wire.includes('凯特·利（萨里山）')
        && wire.includes('推断中') && wire.includes('已渗透');
    })());
    assert('T12b surface 上 ticker（最新情报轮播）', (() => {
      const lis = [...document.querySelectorAll('#ad-ticker li')].map(n => n.textContent);
      return lis.some(t => t.includes('麦凯探长') || t.includes('凯特·利'));
    })());

    // T7 newday 跨日自动触发
    const genBefore = MOCK.chat['$ad_report'].generatedAt;
    MOCK.setFloorStat(Object.assign({}, STAT_GREEN, { '日期和时间': '⏰ 1925年 · 6月14日 · 08:00 · 潜伏期' }));
    AD.dispatchNow('s3-newday');
    const newdayOk = await waitFor(() => MOCK.chat['$ad_report'] && MOCK.chat['$ad_report'].generatedAt !== genBefore, 12000);
    assert('T7 newday 跨日自动触发报告（reason=newday）', newdayOk && MOCK.chat['$ad_report'].reason === 'newday');

    // T8 预约引爆（时间+地点命中 → 戒备置顶 + 主动接触态 + 预约移除）
    MOCK.setFloorStat(Object.assign({}, STAT_GREEN,
      { '日期和时间': '⏰ 1925年 · 6月14日 · 22:00 · 潜伏期', '地点': '📍 悉尼 · 达令港 · 伦道夫船运仓库 · 禁区' }));
    AD.dispatchNow('s3-ambush');
    assert('T8 预约引爆（注入主动接触态 + 戒备置顶 + 预约移除，插入 </当前态势> 之前）', await waitFor(() => {
      const last = WB_MOCK.entry('副导演-态势') || '';
      const rnd = AD.getCards().find(c => c.place === '伦道夫船运仓库');
      const pending = MOCK.chat['$ad_pending'];
      return last.includes('  【⚠ 主动接触态】') && last.endsWith(AD.SIT_CLOSE)
        && last.includes('严密')
        && rnd && rnd.alert === '严密' && pending && pending.ambush.length === 0;
    }, 4000));

    // T9 暗线端点未配置 → 触发条件满足也不调 LLM
    const s3z = AD.loadSettings();
    s3z.shadowline.baseUrl = ''; AD.saveSettings(s3z);
    const offCalls = s3FetchCalls;
    MOCK.setFloorStat(Object.assign({}, STAT_GREEN, { '日期和时间': '⏰ 1925年 · 6月15日 · 08:00 · 潜伏期' }));
    AD.dispatchNow('s3-off');
    await sleep(1500);   // 真实静置：等 dispatch 的异步词条写入落定（waitFor(恒真) 是立即返回，防 T14 捕获到旧内容）
    assert('T9 暗线端点未配置 → 不调 LLM', s3FetchCalls === offCalls);

    // T14 双独立开关（总开关取消——玩家自由决定功能，两开关互不牵连）
    const s4sw = AD.loadSettings();
    s4sw.shadowline = { baseUrl: 'https://mock.local/v1', apiKey: 'k', model: 'smart', temperature: 0.4, maxTokens: 8000 };
    s4sw.enabledSituation = false; AD.saveSettings(s4sw);   // 态势关 · 暗线开
    const sitContent = WB_MOCK.entry('副导演-态势');
    AD.dispatchNow('t14-sit-off');
    assert('T14 态势开关关 → 态势词条下灯（内容保留）', await waitFor(() => {
      const e = WB_MOCK.find('副导演-态势');
      return e && e.enabled === false && e.content === sitContent;
    }, 4000));
    MOCK.setFloorStat(Object.assign({}, STAT_GREEN, { '日期和时间': '⏰ 1925年 · 6月16日 · 08:00 · 潜伏期' }));
    const t14Calls = s3FetchCalls;
    AD.dispatchNow('t14-newday');
    assert('T14b 态势关不影响暗线触发（跨日自动推演照跑）', await waitFor(() => s3FetchCalls === t14Calls + 1, 12000));
    s4sw.enabledSituation = true; s4sw.enabledShadowline = false; AD.saveSettings(s4sw);   // 态势开 · 暗线关
    AD.applySwitches();   // 开关切换即时生效（关→下灯；开→强写重新上灯）
    const t14bCalls = s3FetchCalls;
    await AD.generateShadowlineReport('manual');   // 暗线开关关 → 手动推演被拒
    MOCK.setFloorStat(Object.assign({}, STAT_GREEN, { '日期和时间': '⏰ 1925年 · 6月17日 · 08:00 · 潜伏期' }));
    AD.dispatchNow('t14-newday2');   // 自动触发也被开关拦下
    const sitRelit = await waitFor(() => {
      const e = WB_MOCK.find('副导演-态势');
      return e && e.enabled === true;
    }, 6000);
    assert('T14c 暗线开关关 → 手动/自动推演均不调 LLM + 暗线词条下灯', await waitFor(() => {
      const e = WB_MOCK.find('副导演-暗线');
      return e && e.enabled === false;
    }, 4000) && s3FetchCalls === t14bCalls);
    assert('T14d 态势开关重开 → 词条重新上灯（forceSituationWrite 强写）', sitRelit);
    s4sw.enabledShadowline = true; s4sw.enabledSituation = true; AD.saveSettings(s4sw);   // 恢复双开
    // 清理
    s3z.shadowline = { baseUrl: '', apiKey: '', model: '', temperature: 0.4, maxTokens: 8000 };
    s3z.worldSyncSituation = []; s3z.worldSyncShadowline = [];
    s3z.enemyPool = '';
    AD.saveSettings(s3z);
    window.insertOrAssignVariables({ $ad_roster: { factions: [], tombstones: [] }, $ad_pending: { ambush: [] } }, { type: 'chat' });
  }

  /* ——— 注入通道：世界书词条（MMS 同构）——— */
  head('注入通道（世界书词条 · 位置保留/用户改动合并/禁用兜底）');
  {
    // merge3 纯函数六场景（兜底机制核心：用户对词条的行级改动持续保留在后续注入里）
    const m3 = AD.merge3;
    assert('U1 用户改行：改动词覆盖脚本新内容同位置行', (() => {
      const base = '甲\n乙\n丙', theirs = '甲\n乙改\n丙', ours = '甲\n乙\n丙新';
      const out = m3(base, theirs, ours);
      return out === '甲\n乙改\n丙新';
    })());
    assert('U2 用户删行：脚本更新后该行仍不在', (() => {
      const base = '甲\n乙\n丙', theirs = '甲\n丙', ours = '甲\n乙2\n丙';
      const out = m3(base, theirs, ours);
      return out === '甲\n丙';
    })());
    assert('U3 用户新增行：保留在原位置（脚本同段新增共容）', (() => {
      const base = '甲\n乙', theirs = '甲\n用户注\n乙', ours = '甲\n乙';
      const out = m3(base, theirs, ours);
      return out === '甲\n用户注\n乙';
    })());
    assert('U4 脚本删行（换地点旧态势）：即使用户改过也删', (() => {
      const base = '甲\n乙\n丙', theirs = '甲\n乙改\n丙', ours = '甲';
      const out = m3(base, theirs, ours);
      return out === '甲';
    })());
    assert('U5 双改同行：用户赢（用户修改必须出现在下一轮注入）', (() => {
      const base = '甲\n乙', theirs = '甲\n用户版', ours = '甲\n脚本版';
      const out = m3(base, theirs, ours);
      return out === '甲\n用户版';
    })());
    assert('U6 base 为空（换聊天/首写）：不合并直接覆盖（旧聊天残留不误判为用户改动）', (() => {
      const theirs = '上一聊天的内容';
      const out = m3('', theirs, '新内容');
      return out === '新内容';
    })());
    assert('U7 用户改动 sticky：脚本内容演进后用户改动仍重放', (() => {
      const base = '【态势·A地】\n驻守：X';
      const theirs = '【态势·A地】\n驻守：X\n（GM注：X已换防）';
      const ours1 = m3(base, theirs, base);                 // 第一次更新（无脚本变化）
      const ours2 = m3(base, ours1, '【态势·B地】\n驻守：Y');  // 换地点（脚本删旧行增新行）
      return ours1.includes('（GM注：X已换防）') && ours2 === '【态势·B地】\n驻守：Y\n（GM注：X已换防）';
    })());

    // 端到端：用户改词条内容 → 下一轮注入合并保留
    MOCK.reset(); AD.loadRuntimeState(); AD.setCards(CARDS); AD.state.ammoBaseline = 0;
    MOCK.addFloor({ stat_data: { '状态栏': STAT_GREEN } });
    AD.dispatchNow('wb-a');
    assert('B1 首次写入后词条内容 = 纯脚本内容', await waitFor(() =>
      (WB_MOCK.entry('副导演-态势') || '').includes('驻守：凯特·利'), 4000));
    WB_MOCK.patch('副导演-态势', { content: (WB_MOCK.entry('副导演-态势') || '') + '\n（GM注：凯特已与警方达成默契）' });   // 模拟用户在世界书编辑器改词条
    MOCK.setFloorStat(STAT_ALLEY);   // 换地点（脚本内容大改）
    AD.dispatchNow('wb-b');
    assert('B2 用户改过的词条在脚本换内容时合并：用户注保留 + 兜底态势生效', await waitFor(() => {
      const c = WB_MOCK.entry('副导演-态势') || '';
      return c.includes('此地无驻防情报') && c.includes('（GM注：凯特已与警方达成默契）');
    }, 4000));

    // 端到端：用户调 position（顺序）→ 脚本更新永不覆盖
    WB_MOCK.patch('副导演-态势', { position: { type: 'at_depth', role: 'system', depth: 4, order: 2 } });   // 模拟用户调顺序
    MOCK.setFloorStat(STAT_GREEN);
    AD.dispatchNow('wb-c');
    assert('B3 用户调过的 position 永久保留（脚本只改 content 不动位置）', await waitFor(() => {
      const e = WB_MOCK.find('副导演-态势');
      return e && e.position.depth === 4 && e.position.order === 2
        && (e.content || '').includes('驻守：凯特·利');
    }, 4000));

    // 禁用兜底：无 stat 聊天 → 态势词条下灯（先造残留词条再验证只下灯不删除）
    MOCK.reset();
    await AD.writeWbEntry('副导演-态势', '旧聊天的态势残留');
    AD.dispatchNow('wb-d');   // 楼层表已清 → 无 stat_data
    assert('B4 无 stat_data 聊天 → 态势词条禁用（内容保留不删除）', await waitFor(() => {
      const e = WB_MOCK.find('副导演-态势');
      return e && e.enabled === false && e.content === '旧聊天的态势残留';
    }, 4000));

    // 换聊天：暗线词条按新聊天报告重建（无报告 → 禁用）
    MOCK.reset();
    MOCK.chat['$ad_report'] = { factions: [{ name: 'Z', surface: 's', truth: '暗线Z真相', causes: ['楼1'], state: '推断中' }], resistance: {} };
    AD.loadRuntimeState();
    MOCK.eventEmit('CHAT_CHANGED');
    assert('B5 换聊天 → 暗线词条按新聊天报告重建（wbLast 清空防误判）', await waitFor(() => {
      const c = WB_MOCK.entry('副导演-暗线') || '';
      return c.includes('暗线Z真相') && AD.state.wbLast.shadowline === c;
    }, 4000));
    delete MOCK.chat['$ad_report'];   // 再换到无报告聊天（词条保留，只应下灯）
    MOCK.eventEmit('CHAT_CHANGED');
    assert('B6 换到无报告聊天 → 暗线词条禁用（不删除）', await waitFor(() => {
      const e = WB_MOCK.find('副导演-暗线');
      return e && e.enabled === false && (e.content || '').includes('暗线Z真相');
    }, 4000));
  }

  /* ——— jsonc 导入容错 ——— */
  head('jsonc 导入容错');
  const jsoncSample = `[
  { "place": "绿顶酒馆",   // 行注释：应被剥除
    "aliases": ["凯特的酒馆"],
    "faction": "凯特·利（萨里山）",
    "menu": "萨里山剃刀党混混*4~6", "alert": "警戒",
    "note": "字符串里的 // https://example.com 不应被误伤",
  },   /* 块注释 */
  { "place": "总督套房", "faction": "无", "menu": "", "alert": "常规", },
]`;
  let parsedOk = false, urlKept = false;
  try {
    const parsed = JSON.parse(AD.stripJsonc(jsoncSample));
    parsedOk = Array.isArray(parsed) && parsed.length === 2 && parsed[0].place === '绿顶酒馆';
    urlKept = parsed[0].note.includes('// https://example.com');
  } catch (e) { parsedOk = false; }
  assert('jsonc（行/块注释 + 尾逗号）可解析', parsedOk);
  assert('字符串字面量内的 // 不被误剥', urlKept);
  assert('纯 JSON 原样可解析', (() => {
    try { return JSON.parse(AD.stripJsonc(JSON.stringify(CARDS))).length === 3; }
    catch (e) { return false; }
  })());

  finish();
}
function finish() {
  const total = passed + failed;
  statEl.textContent = failed === 0 ? `${total} 项全部通过 ✓` : `${passed}/${total} 通过，${failed} 失败 ✗`;
  statEl.className = failed === 0 ? 'pass' : 'fail';
  line(failed === 0 ? 'pass' : 'fail', `══ 总计：${passed}/${total} 通过 ══`);
  line('info', '（右侧为本插件真实 UI 挂载，可人工目检折叠/展开与面板）');
}
document.getElementById('run').addEventListener('click', runAll);
</script>
</body>
