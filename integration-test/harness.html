<!DOCTYPE html>
<html lang="zh-CN">

<body>

<script>
/* ════════════════════════════════════════════════════════════════════
   mock 酒馆助手环境（与真实 API 同构）
   ════════════════════════════════════════════════════════════════════ */
const WB_MOCK = (function () {
  // 世界书写入通道 mock：books=可写存储（注入词条），fixtures=固定资料书（双通道/S2 段注册，reset 不清除）
  const store = { books: {}, binding: null, uid: 0 };
  const fixtures = {};
  const calls = { creates: [], updates: [] };   // 写 API 调用记录（entry 名——幂等断言的计数源）

  const clone = v => v === undefined ? v : JSON.parse(JSON.stringify(v));
  const bookOf = name => store.books[name] || (store.books[name] = []);

  window.getCharWorldbookNames = function () { return clone(store.binding); };
  window.getCurrentCharacterName = () => '测试角色';
  window.createWorldbook = function (name) { bookOf(name); };
  window.rebindCharWorldbooks = function (scope, bind) { store.binding = clone(bind); bookOf(bind.primary); };
  window.createWorldbookEntries = function (book, entries) {
    const list = bookOf(book);
    for (const e of entries || []) { list.push(Object.assign({ uid: ++store.uid }, clone(e))); calls.creates.push(e.name); }
  };
  window.updateWorldbookWith = function (book, fn) {
    const out = fn(clone(bookOf(book))) || [];
    store.books[book] = out;
    for (const e of out) if (e) calls.updates.push(e.name);
  };
  // 统一 getWorldbook：固定资料书优先（同步读路径），否则可写存储
  window.getWorldbook = async function (name) {
    if (fixtures[name]) return clone(fixtures[name]);
    return clone(bookOf(name));
  };
  window.getWorldbookNames = () => Object.keys(store.books).concat(Object.keys(fixtures));

  function reset() {
    store.books = {}; store.uid = 0; calls.creates = []; calls.updates = [];
    store.binding = { primary: '主世界书', additional: [] };
    bookOf('主世界书');
  }
  reset();
  const find = name => {
    for (const bk of Object.keys(store.books)) {
      const e = (store.books[bk] || []).find(x => x && x.name === name);
      if (e) return e;
    }
    return null;
  };
  return {
    reset, fixtures, calls, find,
    entry: name => { const e = find(name); return e ? e.content : null; },
    writes: name => calls.creates.filter(n => n === name).length + calls.updates.filter(n => n === name).length,
    binding: () => clone(store.binding),
    // 模拟用户在世界书编辑器里直接改词条（改内容/调位置——不经脚本写 API）
    patch(name, fields) { const e = find(name); if (e) Object.assign(e, clone(fields)); },
  };
})();

const MOCK = (function () {
  const store = { chat: {}, message: {} };   // message: { 楼层号: {…} }
  let floorCount = 0;
  const listeners = [];

  const clone = v => v === undefined ? v : JSON.parse(JSON.stringify(v));
  const realId = id => (id < 0 ? floorCount + id : id);

  window.tavern_events = {
    GENERATION_STARTED: 'GENERATION_STARTED',
    MESSAGE_RECEIVED: 'MESSAGE_RECEIVED',
    MESSAGE_UPDATED: 'MESSAGE_UPDATED',
    MESSAGE_SWIPED: 'MESSAGE_SWIPED',
    CHAT_CHANGED: 'CHAT_CHANGED',
  };
  window.getVariables = function (opt) {
    const o = opt || {};
    if (o.type === 'chat') return clone(store.chat);
    if (o.type === 'message') {
      const id = o.message_id == null ? floorCount - 1 : realId(o.message_id);
      return clone(store.message[id] || {});
    }
    return {};
  };
  window.insertOrAssignVariables = function (vars, opt) {
    const o = opt || {};
    const bucket = o.type === 'chat' ? store.chat
      : o.type === 'message' ? (store.message[realId(o.message_id == null ? -1 : o.message_id)] ||= {})
      : null;
    if (!bucket) return;
    for (const k of Object.keys(vars || {})) bucket[k] = clone(vars[k]);
  };
  window.replaceVariables = function (vars, opt) {
    const o = opt || {};
    if (o.type === 'chat') store.chat = clone(vars) || {};
  };
  window.eventOn = function (name, cb) { listeners.push({ name, cb }); };
  window.eventEmit = function (name, ...args) {
    for (const l of listeners) if (l.name === name) try { l.cb(...args); } catch (e) { console.error(e); }
  };
  // 楼层消息 mock：currentFloorId/checkTriggers/本地骰幂等守卫均读 getChatMessages(-1) 取楼号
  window.getChatMessages = function (id) {
    if (id === 'all') return [];
    return [{ message_id: Math.max(0, floorCount - 1), name: 'AI', role: 'assistant', is_hidden: false,
      message: '众人穿过萨里山的后巷，苦力们警惕地放下木箱。', data: {}, extra: {} }];
  };

  return {
    // 测试辅助
    addFloor(vars) { store.message[floorCount++] = vars || {}; },
    setFloorStat(statData) {
      if (floorCount === 0) floorCount = 1;   // 空楼层表时先立一楼，否则 message_id:-1 解析不到
      store.message[floorCount - 1] = { stat_data: { '状态栏': statData } };
    },
    reset() {
      // 原地清空（不能重新赋值——MOCK.chat 持有引用，重新赋值会与之脱钩）
      for (const k of Object.keys(store.chat)) delete store.chat[k];
      store.message = {}; floorCount = 0;
      WB_MOCK.reset();   // 世界书写入通道同清（重跑/换段隔离）
    },
    eventEmit: (name) => window.eventEmit(name),
    chat: store.chat,
  };
})();

/* ════════════════════════════════════════════════════════════════════
   mock SillyTavern（副导演楼层上下文优先路径 + LWB 摘要通路）
   ════════════════════════════════════════════════════════════════════ */
const ST_MOCK = (function () {
  const chat = [];
  for (let i = 0; i < 30; i++) {
    if (i % 5 === 3) chat.push({ mes: `玩家输入第${i}楼`, is_user: true, is_system: false });
    else if (i % 7 === 6) chat.push({ mes: `被LWB隐藏的旧楼${i}`, is_user: false, is_system: true });   // /hide → is_system（真机实证字段）
    else chat.push({ mes: `AI叙事第${i}楼：夜色中的悉尼。` + (i === 10 ? '\n```状态栏代码块```\n' : ''), is_user: false, is_system: false });
  }
  const aiIds = chat.map((m, i) => (!m.is_user && !m.is_system) ? i : -1).filter(i => i >= 0);
  const meta = {
    extensions: {
      LittleWhiteBox: {
        storySummary: {
          lastSummarizedMesId: 14,
          json: {
            keywords: [{ text: '黑法老兄弟会', weight: '核心' }, { text: '剃刀帮战争', weight: '核心' }],
            events: [
              { timeLabel: '1925年6月12日 08:45', title: '悉尼港海关大厅·入境刁难化解',
                summary: '爱德华出示军情五处信函施压放行。(角色：「台词」) #1-3' },
              { timeLabel: '1925年6月12日 14:50', title: '伦道夫仓库·潜入搜查禁区',
                summary: '玛德琳与索恩发现黑法老长袍与祭祀木棍。 #1-3' },
            ],
          },
        },
      },
    },
  };
  // 真机形态：chat 不在 SillyTavern 顶层，经 getContext() 暴露（实证 2026-09-09）
  window.SillyTavern = { getContext: () => ({ chat, chatMetadata: meta }), chatMetadata: meta };
  return { chat, aiIds };
})();

/* ════════════════════════════════════════════════════════════════════
   测试数据（取自真实聊天记录 #27 楼 stat_data 的结构）
   ════════════════════════════════════════════════════════════════════ */
const CH = (name, hp, hpMax, ammoStr) => ({
  '角色': {
    '名字': ' ' + name,
    '属性': `[❤️HP:${hp}/${hpMax}][🔮MP:110/110][🛡️Armor:40][🧠SAN:59/65]`,
    '弹药': ammoStr,
  },
});
const STAT = (loc, chars) => ({
  '日期和时间': '⏰ 1925年 · 6月13日 · 13:00 · 潜伏期',
  '地点': loc,
  '角色列表': chars,
});

const STAT_GREEN = STAT('📍 悉尼 · 萨里山 · 绿顶酒馆 · 大堂', [
  CH('🔮埃利奥特', 100, 100, '[🔩] [.32子弹：20]'),
  CH('🛡️弗兰克', 180, 180, '[🔩] [.45子弹：28]'),
]);

// S7 世界状态测试数据（$ad_world 同构；派系三态 + 事件链 + 风声 + encounter）
const WORLD = {
  round: 1, digest: '黑帮摩擦升温，警方收网在即',
  factions: [
    { name: '凯特·利（萨里山）', surface: '绿顶酒馆谢绝散客', truth: '凯特要的不是爆破手而是运输队共谋', contact: '', scheme: '以酒馆谈判为饵，实则调虎离山劫仓库', mole: '酒店门童比利（实为凯特眼线）', causes: ['楼23'], state: '推断中', stance: '觊觎主角团的爆破能力', relations: '与剃刀帮结仇', zone: '萨里山', morale: '士气高涨' },
    { name: '麦凯探长（飞行小队）', surface: '克利夫兰街连日设卡', truth: '空白搜查令已备，明日凌晨收网', contact: '便衣警员雷诺兹（伪装成记者）', scheme: '', mole: '', causes: ['楼15'], state: '已渗透', stance: '盯上主角团', relations: '与黑法老兄弟会有旧怨', zone: '悉尼', morale: '按部就班' },
  ],
  events: [
    { name: '仓库冲突', type: 'conflict', stage: '逼近', stageRound: 5, level: 2, factions: ['凯特·利（萨里山）'], zone: '', desc: '双方在仓库周边对峙' },
    { name: '警方收网筹备', type: 'progress', stage: '发酵', stageRound: 3, level: 3, factions: ['麦凯探长（飞行小队）'], zone: '悉尼', desc: '搜查令流转中' },
  ],
  winds: [
    { content: '达令港夜里能听见仓库方向的枪声', source: '码头工人', spread: '流传', level: 2, quietRounds: 0 },
  ],
  encounter: {
    heat: { value: 10, why: '多线冲突临近爆发' },
    spots: [{ match: '伦道夫船运仓库', chance: 60, why: '黑法老触点盘踞' },
      { match: '澳大利亚酒店 - 总督套房', chance: 0, why: '己方据点' }],
    districts: [{ match: '萨里山', chance: 25, why: '帮派混战区' }],
  },
  resistance: {
    forbidden: [{ truth: '炸药原属伦道夫/黑法老兄弟会', path: '由玩家在谈判桌上自行打出', leak_cost: '谈判筹码崩塌' }],
    partial: ['只得到"有人整箱扫货"的粗话原话'],
    friction: ['警方全城戒备'],
  },
  roster_ops: [], generatedAt: Date.now(), reason: 'harness',
};

/* ════════════════════════════════════════════════════════════════════
   断言框架
   ════════════════════════════════════════════════════════════════════ */
const logEl = document.getElementById('log');
const statEl = document.getElementById('stat');
let passed = 0, failed = 0;
function line(cls, msg) { logEl.innerHTML += `<span class="${cls}">${msg}</span>\n`; }
function head(t) { line('head', `── ${t} ──`); }
function ok(desc, extra) { passed++; line('pass', `  ✓ ${desc}${extra ? '  ⟨' + extra + '⟩' : ''}`); }
function ng(desc, extra) { failed++; line('fail', `  ✗ ${desc}${extra ? '  ⟨' + extra + '⟩' : ''}`); }
function assert(desc, cond, extra) { cond ? ok(desc, extra) : ng(desc, extra); }
const sleep = ms => new Promise(r => setTimeout(r, ms));
// 条件轮询：IAB 对未聚焦页面节流 setTimeout（实测 ~1s 粒度），
// 固定 sleep 与 content 的 800ms 去抖时序不可控，改为自适应等待
async function waitFor(cond, timeoutMs = 15000) {
  const t0 = Date.now();
  while (Date.now() - t0 < timeoutMs) {
    if (cond()) return true;
    await sleep(150);
  }
  return cond();
}

let AD = null;

/* ════════════════════════════════════════════════════════════════════
   断言套件
   ════════════════════════════════════════════════════════════════════ */
async function runAll() {
  passed = 0; failed = 0; logEl.innerHTML = '';

  /* ——— 载入真实产物 ——— */
  head('环境与初始化');
  let json;
  try {
    const res = await fetch('../酒馆助手脚本-副导演.json');
    json = await res.json();
  } catch (e) { ng('产物 JSON 加载失败', String(e)); return finish(); }
  assert('产物 JSON 载入（type=script）', json.type === 'script');
  assert('content 非空', typeof json.content === 'string' && json.content.length > 1000, `${json.content.length} 字符`);
  assert('版本 v0.3.1（世界引擎化重构 + tab 栏）', json.content.includes("@version      0.3.1"));
  MOCK.reset();   // 重跑隔离：清残留楼层变量与世界书词条（HAS_WB 探测在 content 执行时完成）
  try { new Function(json.content).call(window); } catch (e) { ng('content 执行异常', String(e)); return finish(); }
  AD = window.__AD__;
  assert('__AD__ 测试钩子暴露', !!AD);
  assert('LIVE 环境检测通过（mock API 全套）', AD.IS_LIVE === true);
  assert('世界书写入能力探测通过（注入通道）', AD.HAS_WB === true);
  assert('悬浮窗挂载（#ad-rail）', !!document.getElementById('ad-rail'));
  assert('面板挂载（#ad-panel）', !!document.getElementById('ad-panel'));  assert('GM 工具按钮 ×5（报头内联：📡↻🌍📜⚙）', document.querySelectorAll('#ad-panel .ad-head-btns button').length === 5);
  await sleep(1200); // init 去抖静默期（无 stat → 只走禁用探测，不建词条）
  assert('无楼层时 init 不写入词条', WB_MOCK.writes('副导演') === 0);

  /* ——— 纯函数：归一化与区块匹配 ——— */
  head('地点归一化与区块匹配');
  assert('剥 emoji/空白归一化', AD.norm('📍 悉尼 · 绿顶酒馆') === '悉尼 · 绿顶酒馆');
  assert('Z1 zoneMatch 双向包含（pattern⊂text）', AD.zoneMatch('萨里山', '📍 悉尼 · 萨里山 · 绿顶酒馆') === true);
  assert('Z2 zoneMatch 双向包含（text⊂pattern）', AD.zoneMatch('悉尼萨里山码头', '萨里山') === true);
  assert('Z3 zoneMatch 未命中 / 空串', AD.zoneMatch('墨尔本', '悉尼') === false && AD.zoneMatch('', '悉尼') === false);
  assert('L1 地标键：大区后首字段（含子标题）', AD.landmarkKey('📍 悉尼 · 澳大利亚酒店 - 总督套房 · 客厅与全景窗前') === '澳大利亚酒店 - 总督套房');
  assert('L2 地标键：房间级变化不改变键', AD.landmarkKey('📍 悉尼 · 澳大利亚酒店 - 总督套房 · 玄关') === '澳大利亚酒店 - 总督套房');
  assert('L3 地标键：单段地点', AD.landmarkKey('📍 某独立地标') === '某独立地标');

  /* ——— S7 信号级态势文本（驻守信号 + 临近冲突提醒）——— */
  head('S7 信号级态势文本');
  {
    const locGreen = '📍 悉尼 · 萨里山 · 绿顶酒馆 · 大堂';
    let text = AD.buildDirectorSituationText(locGreen, null);
    assert('无世界状态：尚无档案提示 + 敌方由正文AI自选 + XML 包裹', text.startsWith(AD.SIT_OPEN) && text.endsWith(AD.SIT_CLOSE)
      && text.includes('尚无世界态势档案') && text.includes('世界书图鉴与剧情合理性决定')
      && text.includes('<Combat_block>'));
    text = AD.buildDirectorSituationText(locGreen, WORLD);
    assert('有世界状态：大区命中派系驻守信号（名称/大区/士气）', text.includes('驻守信号：凯特·利（萨里山）（萨里山）')
      && text.includes('士气：士气高涨') && text.includes('对我方：觊觎主角团的爆破能力'));
    assert('有世界状态：无敌人菜单（正文 AI 自选，不再列词条）', !text.includes('词条*') && !text.includes('驻守：'));
    const locRnd = '📍 悉尼 · 达令港 · 伦道夫船运仓库 · 禁区';
    text = AD.buildDirectorSituationText(locRnd, WORLD);
    assert('冲突事件爆发阶段 → 临近冲突提醒行', (() => {
      const hot = JSON.parse(JSON.stringify(WORLD));
      hot.events[0].stage = '爆发';
      hot.events[0].zone = '达令港';   // 事件归属当前大区（无派系关联时自带 zone）
      hot.events[0].factions = [];
      return AD.buildDirectorSituationText(locRnd, hot).includes('【⚠ 临近冲突】仓库冲突已推进到爆发阶段');
    })());
    assert('跨大区爆发事件不提醒（萨里山的事件不警示达令港）', (() => {
      const hot = JSON.parse(JSON.stringify(WORLD));
      hot.events[0].stage = '爆发';   // zone 经派系=凯特（萨里山），不命中达令港
      return !AD.buildDirectorSituationText(locRnd, hot).includes('【⚠ 临近冲突】');
    })());
    // 麦凯 zone=悉尼：地点大区=悉尼 时其驻守信号也命中（zoneMatch 双向包含）
    const locHotel = '📍 悉尼 · 澳大利亚酒店 - 总督套房 · 客厅';
    text = AD.buildDirectorSituationText(locHotel, WORLD);
    assert('多派系命中时最多列 3 条（悉尼/萨里山双命中）', text.includes('麦凯探长（飞行小队）') || text.includes('此地无已知派系驻防'));
  }

  /* ——— S7 本地骰（事件链推进 / 风声衰减 / swipe 幂等）——— */
  head('S7 本地骰（事件推进/风声衰减/幂等守卫）');
  {
    const rr = Math.random;
    // 事件链推进：dice=100 恒推进；stageRound 到 9 晋级下一阶段
    let w1 = JSON.parse(JSON.stringify(WORLD));
    Math.random = () => 0.999;   // dice = floor(0.999*100)+1 = 100 > 任何阈值 → 恒推进
    AD.rollEvents(w1, Math.random);
    assert('D1 高骰推进：stageRound 5→6（阶段不变）', w1.events[0].stageRound === 6 && w1.events[0].stage === '逼近');
    w1.events[0].stageRound = 8;
    AD.rollEvents(w1, Math.random);
    assert('D2 stageRound≥9 → 晋级下一阶段（conflict 逼近→爆发，stageRound 重置 1）', w1.events[0].stage === '爆发' && w1.events[0].stageRound === 1);
    // 受挫：dice=1 < 阈值×0.4 → 回退
    let w2 = JSON.parse(JSON.stringify(WORLD));
    Math.random = () => 0;   // dice = 1
    AD.rollEvents(w2, Math.random);
    assert('D3 低骰受挫：stageRound 回退（5→4）', w2.events[0].stageRound === 4);
    // 平息事件不再推进（单事件隔离——其他事件恒推进会掩盖）
    let w3 = { events: [JSON.parse(JSON.stringify(WORLD.events[0]))] };
    w3.events[0].stage = '平息'; w3.events[0].stageRound = 3;
    Math.random = () => 0.999;
    const d3changed = AD.rollEvents(w3, Math.random);
    assert('D4 平息阶段事件不掷骰', w3.events[0].stage === '平息' && w3.events[0].stageRound === 3 && d3changed === false);
    Math.random = rr;

    // 风声衰减：grace 内不衰减；超时按线性概率衰减（dice=1 恒消散）
    let w4 = JSON.parse(JSON.stringify(WORLD));
    Math.random = () => 0.5;
    AD.rollWinds(w4, Math.random);
    assert('W1 安静楼数累加（quietRounds 0→1），grace 内不衰减', w4.winds.length === 1 && w4.winds[0].quietRounds === 1);
    w4.winds[0].quietRounds = 9;   // 远超 grace=3：n=6，chance=10+15×6=100%
    Math.random = () => 0;   // dice=1 ≤ chance → 消散
    const w4changed = AD.rollWinds(w4, Math.random);
    assert('W2 超时风声按递增概率消散（数组剔除）', w4changed === true && w4.winds.length === 0);
    Math.random = rr;

    // runLocalDice 幂等：同 floorId 不重复掷
    MOCK.reset(); AD.loadRuntimeState();
    MOCK.addFloor({ stat_data: { '状态栏': STAT_GREEN } });   // floorCount=1 → floorId=0

    assert('D5 runLocalDice 首掷推进并回写 $ad_world', ev1 === 6);

    AD.runLocalDice();
    assert('D6 同 floorId 幂等：swipe/重roll 重触发不重复推进', MOCK.chat.$ad_world.events[0].stageRound === ev1);
    MOCK.addFloor({ stat_data: { '状态栏': STAT_GREEN } });   // 新楼 floorId=1
    AD.runLocalDice();
    assert('D7 新楼恢复掷骰（floorId 前进）', MOCK.chat.$ad_world.events[0].stageRound === Math.max(1, ev1 - 1));   // Math.random=0 → 受挫回退

  /* ——— S7 遇敌概率档案（三级兜底 + 冷热修正 + 安全区）——— */

    assert('R2b 副导演词条级联重写（无该派系真相，其他派系保留）', await waitFor(() => {

    // R3 恢复：出墓碑回名册（非墓碑名拒绝）

    // R4 墓碑过滤：validateWorld 丢弃墓碑派系（世界状态输出为零），其余保留

      && vr.world.factions[0].name === '麦凯探长（飞行小队）');

    // R5 端到端：模型违反铁律输出墓碑派系 → 世界状态落地无它 + 不回册 + 新派系照常登记
    s5Responder = () => JSON.stringify({ digest: 's5', factions: [

        && AD.getRoster().factions.includes('全新派系');

    // R6 UI：名册弹窗渲染 + 行内按钮操作

      const box = document.getElementById('ad-modal-box');

    const r6Before = AD.getRoster().factions.length;

    assert('R6b 弹窗除名按钮生效（点击→墓碑 + 弹窗重渲染）', AD.getRoster().factions.length === r6Before - 1

    const s5z = AD.loadSettings();
    s5z.director = { baseUrl: '', apiKey: '', model: '', temperature: 0.4, maxTokens: 4000 };

  /* ——— S4 公开层·阶段揭示（灰卡 / 接触即揭 / 新面孔 / 平静占位 / 墓碑联动）——— */

  {

  /* ——— 注入通道：世界书词条（MMS 同构）——— */
  head('注入通道（世界书词条 · 位置保留/用户改动合并/禁用兜底）');
  {
    // merge3 纯函数六场景（兜底机制核心：用户对词条的行级改动持续保留在后续注入里）
    const m3 = AD.merge3;
    assert('U1 用户改行：改动词覆盖脚本新内容同位置行', (() => {
      const base = '甲\n乙\n丙', theirs = '甲\n乙改\n丙', ours = '甲\n乙\n丙新';
      const out = m3(base, theirs, ours);
      return out === '甲\n乙改\n丙新';
    })());
    assert('U2 用户删行：脚本更新后该行仍不在', (() => {
      const base = '甲\n乙\n丙', theirs = '甲\n丙', ours = '甲\n乙2\n丙';
      const out = m3(base, theirs, ours);
      return out === '甲\n丙';
    })());
    assert('U3 用户新增行：保留在原位置（脚本同段新增共容）', (() => {
      const base = '甲\n乙', theirs = '甲\n用户注\n乙', ours = '甲\n乙';
      const out = m3(base, theirs, ours);
      return out === '甲\n用户注\n乙';
    })());
    assert('U4 脚本删行（换地点旧态势）：即使用户改过也删', (() => {
      const base = '甲\n乙\n丙', theirs = '甲\n乙改\n丙', ours = '甲';
      const out = m3(base, theirs, ours);
      return out === '甲';
    })());
    assert('U5 双改同行：用户赢（用户修改必须出现在下一轮注入）', (() => {
      const base = '甲\n乙', theirs = '甲\n用户版', ours = '甲\n脚本版';
      const out = m3(base, theirs, ours);
      return out === '甲\n用户版';
    })());
    assert('U6 base 为空（换聊天/首写）：不合并直接覆盖（旧聊天残留不误判为用户改动）', (() => {
      const theirs = '上一聊天的内容';
      const out = m3('', theirs, '新内容');
      return out === '新内容';
    })());
    assert('U7 用户改动 sticky：脚本内容演进后用户改动仍重放', (() => {
      const base = '【态势·A地】\n驻守：X';
      const theirs = '【态势·A地】\n驻守：X\n（GM注：X已换防）';
      const ours1 = m3(base, theirs, base);                 // 第一次更新（无脚本变化）
      const ours2 = m3(base, ours1, '【态势·B地】\n驻守：Y');  // 换地点（脚本删旧行增新行）
      return ours1.includes('（GM注：X已换防）') && ours2 === '【态势·B地】\n驻守：Y\n（GM注：X已换防）';
    })());

    // 端到端：用户改词条内容 → 下一轮注入合并保留
    MOCK.reset(); AD.loadRuntimeState();
    MOCK.addFloor({ stat_data: { '状态栏': STAT_GREEN } });
    AD.dispatchNow('wb-a');
    assert('B1 首次写入后词条内容 = 纯脚本内容', await waitFor(() =>
      (WB_MOCK.entry('副导演') || '').includes('尚无世界态势档案'), 4000));
    WB_MOCK.patch('副导演', { content: (WB_MOCK.entry('副导演') || '') + '\n（GM注：凯特已与警方达成默契）' });   // 模拟用户在世界书编辑器改词条
    window.insertOrAssignVariables({ $ad_world: JSON.parse(JSON.stringify(WORLD)) }, { type: 'chat' });   // 换世界状态（脚本内容大改）
    AD.dispatchNow('wb-b');
    assert('B2 用户改过的词条在脚本换内容时合并：用户注保留 + 新世界动态生效', await waitFor(() => {
      const c = WB_MOCK.entry('副导演') || '';
      return c.includes('驻守信号：凯特·利（萨里山）') && c.includes('（GM注：凯特已与警方达成默契）');
    }, 4000));

    // 端到端：用户调 position（顺序）→ 脚本更新永不覆盖
    WB_MOCK.patch('副导演', { position: { type: 'at_depth', role: 'system', depth: 4, order: 2 } });   // 模拟用户调顺序
    AD.dispatchNow('wb-c');
    assert('B3 用户调过的 position 永久保留（脚本只改 content 不动位置）', await waitFor(() => {
      const e = WB_MOCK.find('副导演');
      return e && e.position.depth === 4 && e.position.order === 2
        && (e.content || '').includes('驻守信号：凯特·利（萨里山）');
    }, 4000));

    // 禁用兜底：无 stat 聊天 → 词条下灯（先造残留词条再验证只下灯不删除）
    MOCK.reset();
    await AD.writeWbEntry('副导演', '旧聊天的副导演残留');
    AD.dispatchNow('wb-d');   // 楼层表已清 → 无 stat_data
    assert('B4 无 stat_data 聊天 → 副导演词条禁用（内容保留不删除）', await waitFor(() => {
      const e = WB_MOCK.find('副导演');
      return e && e.enabled === false && e.content === '旧聊天的副导演残留';
    }, 4000));

    // 换聊天：副导演词条按新聊天世界状态重建（无状态 → 禁用）
    MOCK.reset();
    MOCK.chat['$ad_world'] = JSON.parse(JSON.stringify(WORLD));
    AD.loadRuntimeState();
    MOCK.eventEmit('CHAT_CHANGED');
    assert('B5 换聊天 → 副导演词条按新聊天世界状态重建（wbLast 清空防误判）', await waitFor(() => {
      const c = WB_MOCK.entry('副导演') || '';
      return c.includes('空白搜查令已备') && AD.state.wbLast.director === c;
    }, 4000));
    delete MOCK.chat['$ad_world'];   // 再换到无状态聊天（词条保留，只应下灯）
    MOCK.eventEmit('CHAT_CHANGED');
    assert('B6 换到无状态聊天 → 副导演词条禁用（不删除）', await waitFor(() => {
      const e = WB_MOCK.find('副导演');
      return e && e.enabled === false && (e.content || '').includes('空白搜查令已备');
    }, 4000));

    // 旧词条升级下灯：V0.2.x 双词条（副导演-态势/副导演-暗线）残留 → disable 不删
    MOCK.reset();
    await AD.writeWbEntry('副导演-态势', '旧版态势内容');
    await AD.writeWbEntry('副导演-暗线', '旧版暗线内容');
    MOCK.chat['$ad_world'] = JSON.parse(JSON.stringify(WORLD));
    AD.loadRuntimeState();
    MOCK.eventEmit('CHAT_CHANGED');
    assert('B7 V0.2.x 旧双词条升级下灯（内容保留不删除，新词条接管注入）', await waitFor(() => {
      const oldSit = WB_MOCK.find('副导演-态势'), oldSh = WB_MOCK.find('副导演-暗线'), nw = WB_MOCK.find('副导演');
      return oldSit && oldSit.enabled === false && oldSit.content === '旧版态势内容'
        && oldSh && oldSh.enabled === false && oldSh.content === '旧版暗线内容'
        && nw && nw.enabled === true;
    }, 6000));
  }

  /* ——— S6：随机遭遇掷骰（动态概率 + 防连战锁 + 用户楼注入）——— */
  head('S6 随机遭遇掷骰（用户楼输入注入）');
  {
    const stChat = SillyTavern.getContext().chat;   // 与 ST_MOCK.chat 同引用
    const BASE_LEN = stChat.length;
    const realRandom = Math.random;
    const s6 = AD.settings();                       // SETTINGS 同引用，就地改即时生效
    const clearWorld = () => { try { window.replaceVariables({}, { type: 'chat' }); } catch (e) {} delete MOCK.chat.$ad_world; };
    const setWorld = w => { window.insertOrAssignVariables({ $ad_world: w }, { type: 'chat' }); };
    const restore = () => {
      while (stChat.length > BASE_LEN) stChat.pop();
      Math.random = realRandom;
      s6.randomCombatEnabled = true; s6.randomCombatChance = 5; s6.randomCombatOncePerCycle = true;
      AD.state.randomCombatFired = false;
      clearWorld();
    };
    const setupUserFloor = mes => { restore(); stChat.push({ mes, is_user: true, is_system: false }); };
    const lastMes = () => String(stChat[stChat.length - 1].mes || '');

    // ── 无世界状态：与 S6 原行为一致（玩家设置概率）──
    setupUserFloor('我们进酒馆喝一杯。');
    Math.random = () => 0;
    MOCK.eventEmit('GENERATION_STARTED', 'normal', {}, false);
    assert('掷骰命中 → 用户楼末尾追加标记与指令（原文保留）',
      lastMes().includes('我们进酒馆喝一杯。') && lastMes().includes(AD.RC_MARKER) && lastMes().includes(AD.RC_DIRECTIVE));

    setupUserFloor('再去码头看看。');
    Math.random = () => 0.999;
    MOCK.eventEmit('GENERATION_STARTED', 'normal', {}, false);
    assert('掷骰未命中 → 原文不变', lastMes() === '再去码头看看。');

    setupUserFloor('边界甲');
    s6.randomCombatChance = 5; Math.random = () => 0.049;
    MOCK.eventEmit('GENERATION_STARTED', 'normal', {}, false);
    assert('5% 边界：random=0.049 命中', lastMes().includes(AD.RC_MARKER));
    setupUserFloor('边界乙');
    Math.random = () => 0.051;
    MOCK.eventEmit('GENERATION_STARTED', 'normal', {}, false);
    assert('5% 边界：random=0.051 不命中', !lastMes().includes(AD.RC_MARKER));
    setupUserFloor('边界丙');
    s6.randomCombatChance = 0; Math.random = () => 0;
    MOCK.eventEmit('GENERATION_STARTED', 'normal', {}, false);
    assert('概率 0 → 永不触发', !lastMes().includes(AD.RC_MARKER));
    restore();

    // ── 有世界状态：动态概率（spots 命中 100% 必注入 + 来源标注）──
    MOCK.addFloor({ stat_data: { '状态栏': STAT('📍 悉尼 · 达令港 · 伦道夫船运仓库 · 禁区', [CH('🔮埃利奥特', 100, 100, '[🔩] [.32子弹：20]')]) } });
    setupUserFloor('摸进仓库。');
    setWorld(Object.assign(JSON.parse(JSON.stringify(WORLD)), { encounter: { heat: { value: 0, why: '' }, spots: [{ match: '伦道夫船运仓库', chance: 100, why: '热区' }], districts: [] } }));
    Math.random = () => 0.999;   // 即便 99.9% 骰值也命中（chance=100）
    MOCK.eventEmit('GENERATION_STARTED', 'normal', {}, false);
    assert('动态概率：spots 命中 chance=100 → 必注入', lastMes().includes(AD.RC_MARKER));
    assert('动态概率命中后防连战锁上锁（randomCombatFired=true）', AD.state.randomCombatFired === true);

    // 防连战锁两例直接续楼（不走 setupUserFloor——其 restore 会清锁/清 world）
    stChat.push({ mes: '锁住了再试。', is_user: true, is_system: false });
    Math.random = () => 0;   // 概率再高也被锁拦下
    MOCK.eventEmit('GENERATION_STARTED', 'normal', {}, false);
    assert('防连战锁：同推演周期内二次掷骰被拦（无逻辑连战防护）', !lastMes().includes(AD.RC_MARKER));

    stChat.push({ mes: '关锁再试。', is_user: true, is_system: false });
    s6.randomCombatOncePerCycle = false;
    MOCK.eventEmit('GENERATION_STARTED', 'normal', {}, false);
    assert('防连战锁开关关闭 → 不拦（连续触发允许）', lastMes().includes(AD.RC_MARKER));
    s6.randomCombatOncePerCycle = true;

    // ── 显式安全区：spots chance=0 → 跳过掷骰（不叠冷热修正）──
    setupUserFloor('回酒店休息。');
    MOCK.addFloor({ stat_data: { '状态栏': STAT('📍 悉尼 · 澳大利亚酒店 - 总督套房 · 客厅', [CH('🔮埃利奥特', 100, 100, '[🔩] [.32子弹：20]')]) } });
    setWorld(Object.assign(JSON.parse(JSON.stringify(WORLD)), { encounter: { heat: { value: 30, why: '极热' }, spots: [{ match: '澳大利亚酒店', chance: 0, why: '己方据点' }], districts: [] } }));
    Math.random = () => 0;
    MOCK.eventEmit('GENERATION_STARTED', 'normal', {}, false);
    assert('显式安全区（spots chance=0）→ 跳过掷骰（heat=30 也不抬出）', !lastMes().includes(AD.RC_MARKER));

    // ── 开关 / 模式守卫 / 防重复 ──
    restore();
    setupUserFloor('开关关');
    s6.randomCombatEnabled = false; Math.random = () => 0;
    MOCK.eventEmit('GENERATION_STARTED', 'normal', {}, false);
    assert('开关关闭 → 不注入', !lastMes().includes(AD.RC_MARKER));
    s6.randomCombatEnabled = true;
    for (const [t, d] of [['swipe', false], ['regenerate', false], ['normal', true]]) {
      setupUserFloor(`模式${t}`);
      MOCK.eventEmit('GENERATION_STARTED', t, {}, d);
      assert(`GENERATION_STARTED(${t}${d ? ' · dryRun' : ''}) → 不注入`, !lastMes().includes(AD.RC_MARKER));
    }

    setupUserFloor('已有标记的楼\n' + AD.RC_MARKER + ' ' + AD.RC_DIRECTIVE + '。');
    MOCK.eventEmit('GENERATION_STARTED', 'normal', {}, false);
    assert('已含标记 → 不重复追加', lastMes().split(AD.RC_MARKER).length === 2);

    // ── 战斗进行中 / 末楼非用户楼 ──
    restore();
    stChat.push({ mes: '<Combat_block>\n战斗数据栏: 我方/敌方列表……\n</Combat_block>', is_user: false, is_system: false });
    assert('combatInProgress：最近可见 AI 楼含 Combat_block', AD.combatInProgress() === true);
    stChat.push({ mes: '继续战斗', is_user: true, is_system: false });
    Math.random = () => 0;
    MOCK.eventEmit('GENERATION_STARTED', 'normal', {}, false);
    assert('战斗进行中 → 跳过掷骰', !lastMes().includes(AD.RC_MARKER));

    restore();
    assert('combatInProgress：无战斗楼时为 false', AD.combatInProgress() === false);
    stChat.push({ mes: 'AI 叙事楼（末楼非用户楼兜底）', is_user: false, is_system: false });
    MOCK.eventEmit('GENERATION_STARTED', 'normal', {}, false);
    assert('末楼为 AI 楼 → 不注入', !stChat[stChat.length - 1].mes.includes(AD.RC_MARKER));

    restore();
  }

  finish();
}
function finish() {
  const total = passed + failed;
  statEl.textContent = failed === 0 ? `${total} 项全部通过 ✓` : `${passed}/${total} 通过，${failed} 失败 ✗`;
  statEl.className = failed === 0 ? 'pass' : 'fail';
  line(failed === 0 ? 'pass' : 'fail', `══ 总计：${passed}/${total} 通过 ══`);
  line('info', '（右侧为本插件真实 UI 挂载，可人工目检折叠/展开与面板）');
}
document.getElementById('run').addEventListener('click', runAll);
</script>
